<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Sikanoppapeli</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 30px; background-color: #f0f0f0; }
    h1 { color: #333; }
    .hidden { display: none; }
    .dice { font-size: 60px; margin: 10px; }
    .btns button { margin: 5px; padding: 10px 20px; font-size: 16px; }
    .active-player { font-weight: bold; color: green; }
  </style>
</head>
<body>

  <h1>Sikanoppapeli 🐷🎲</h1>

  <!-- Pelimuodon valinta -->
  <div id="modeSelect">
    <p>Valitse pelimuoto:</p>
    <button onclick="startGame(1)">Versio 1: Yksi noppa</button>
    <button onclick="startGame(2)">Versio 2: Kaksi noppaa</button>
  </div>

  <!-- Pelialue versio 1 -->
  <div id="game1" class="hidden">
    <h2>Versio 1 – Yksi noppa</h2>
    <p><span class="active-player" id="p1Name1">Pelaaja 1</span>: <span id="p1Score1">0</span> | <span id="p2Name1">Pelaaja 2</span>: <span id="p2Score1">0</span></p>
    <p>Kierroksen pisteet: <span id="round1">0</span></p>
    <div class="dice" id="die1">🎲</div>
    <div class="btns">
      <button onclick="rollOneDie()">Heitä</button>
      <button onclick="holdOneDie()">Päättyy vuoro</button>
    </div>
  </div>

  <!-- Pelialue versio 2 -->
  <div id="game2" class="hidden">
    <h2>Versio 2 – Kaksi noppaa</h2>
    <p><span class="active-player" id="p1Name2">Pelaaja 1</span>: <span id="p1Score2">0</span> | <span id="p2Name2">Pelaaja 2</span>: <span id="p2Score2">0</span></p>
    <p>Kierroksen pisteet: <span id="round2">0</span> | Tuplat peräkkäin: <span id="doubles">0</span></p>
    <div>
      <span class="dice" id="die2a">🎲</span>
      <span class="dice" id="die2b">🎲</span>
    </div>
    <div class="btns">
      <button onclick="rollTwoDice()">Heitä</button>
      <button onclick="holdTwoDice()">Päättyy vuoro</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
